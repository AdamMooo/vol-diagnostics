name: Data Freshness Check

# Daily monitor: verifies that data collection is working.
# Runs after the data collection job finishes. If data is stale, creates an issue.
#
# Reads the same Object Storage copy the collection job writes, so this check no
# longer depends on the Oracle VM being reachable (2026-08-20).

on:
  schedule:
    # Must run AFTER the last collection attempt of the session, not between them.
    # Collection retries at 20:35 / 22:30 / 00:30 UTC; checking at 21:00 would report
    # a false STALE whenever the first attempt failed and a later one was about to
    # succeed. 01:00 UTC Tue-Sat is past all three, so a stale reading here is real.
    - cron: "0 1 * * 2-6"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fire drill: force a failure to prove the alert path still reaches you"
        type: boolean
        default: false

jobs:
  check-freshness:
    runs-on: ubuntu-latest

    # The "Report failure" step calls issues.create(). Without this block the job's
    # GITHUB_TOKEN is read-only and that call dies with "Resource not accessible by
    # integration" — so a stale-data alert could never actually be raised.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history from Object Storage
        env:
          OCI_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY_ID }}
          OCI_CUSTOMER_SECRET_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
        run: |
          python -m engine.restore_from_oci \
            --bucket vol-diagnostics-backup --region ca-toronto-1 --dest ./out --force

      - name: Check data freshness
        id: freshness
        run: |
          # An alarm nobody has tested is not an alarm. This lets the whole
          # notification path be exercised on demand without waiting for a real outage.
          if [ "${{ github.event.inputs.simulate_failure }}" = "true" ]; then
            echo "SIMULATED FAILURE - fire drill only, data is not actually stale."
            exit 1
          fi
          python3 << 'EOF'
          import pandas as pd
          from datetime import datetime, timedelta
          import sys

          # Load latest snapshot
          try:
            df = pd.read_parquet("out/gex_snapshots.parquet")
            latest_date = df['date'].max()
            print(f"Latest data: {latest_date}")
          except Exception as e:
            print(f"ERROR: Could not read snapshot: {e}")
            sys.exit(1)

          # Check: is data from today (trading day)?
          # Today in ET
          from pytz import timezone
          et = timezone('US/Eastern')
          today_et = datetime.now(et).date()

          # Calculate expected date (today if trading day, else most recent trading day).
          # The window must be computed from today, never hardcoded: a literal end_date
          # freezes expected_date and makes every later run report a false STALE.
          from pandas_market_calendars import get_calendar
          nyse = get_calendar('NYSE')
          valid_dates = nyse.valid_days(
            start_date=today_et - timedelta(days=14),
            end_date=today_et,
          )
          if len(valid_dates) == 0:
            print("ERROR: no NYSE trading days in the last 14 calendar days")
            sys.exit(1)
          expected_date = valid_dates[-1].date()  # Most recent trading day

          # df['date'].max() may come back as a pandas Timestamp; normalise so the
          # comparison and the subtraction below are both plain date arithmetic.
          latest_date = pd.Timestamp(latest_date).date()

          if latest_date == expected_date:
            print(f"✓ HEALTHY: data current ({latest_date})")
            with open('/tmp/freshness_status', 'w') as f:
              f.write('HEALTHY')
          else:
            days_stale = (expected_date - latest_date).days
            print(f"⚠ STALE: data is {days_stale} trading days old ({latest_date}, expected {expected_date})")
            with open('/tmp/freshness_status', 'w') as f:
              f.write(f'STALE:{days_stale}')
            sys.exit(1)
          EOF

      # Failure-only. The daily report email was retired 2026-08-18 as noise; this is
      # the opposite — it fires only when something is actually broken. Email rather
      # than relying on the GitHub issue alone, because issues depend on notification
      # settings and every prior alert was swallowed before anyone saw it.
      - name: Email failure alert
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GEX_EMAIL_TO: ${{ secrets.GEX_EMAIL_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m engine.alert \
            --workflow "Data Freshness Check" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --detail "The freshness monitor reports stored history is behind the latest NYSE trading day."

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Data Collection Failure',
              body: `Data collection has gone stale. Last successful collection was more than 1 trading day ago. Check the latest workflow run: ${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['data-pipeline']
            })
