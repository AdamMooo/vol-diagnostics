name: A1.Flex Capacity Retry

# Oracle's Always-Free ARM shape (VM.Standard.A1.Flex, 2 OCPU / 12 GB) is
# chronically "out of host capacity" in Toronto. Rather than a human hammering
# the console/CLI from their laptop, this runs on a schedule 24/7 on GitHub's
# runners and opens an issue the moment a launch succeeds — so it's found on
# return, not missed silently. Safe to leave running indefinitely: a launch
# attempt when the instance already exists is skipped (see the existence
# check below), so this never creates duplicates.

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 min — Oracle's launch API rate-limits below ~5min anyway
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI via env vars (no config file needed)
        run: echo "OCI CLI reads OCI_CLI_* env vars directly — see next step."

      - name: Check if the instance already exists (avoid duplicate launches)
        id: check
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_COMPARTMENT_REGION }}
        run: |
          set -e
          existing=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --display-name vol-diagnostics-a1 \
            --lifecycle-state RUNNING \
            --query "data[0].id" --raw-output 2>/dev/null || echo "")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "already_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt launch across all configured region/AD targets
        id: attempt
        if: steps.check.outputs.already_running == 'false'
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.VOL_DIAGNOSTICS_SSH_PUBLIC_KEY }}
          # Pipe-separated "region|ad|subnet_id|image_id" quads, one per line.
          # Fill in additional lines (Montreal/Ashburn) once subscribed+configured.
          TARGETS: ${{ secrets.OCI_A1_TARGETS }}
        run: |
          set +e
          launched="false"
          while IFS='|' read -r region ad subnet image; do
            [ -z "$region" ] && continue
            echo "Trying $region / $ad ..."
            out=$(OCI_CLI_REGION="$region" oci compute instance launch \
              --availability-domain "$ad" \
              --compartment-id "$COMPARTMENT_ID" \
              --shape VM.Standard.A1.Flex \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$subnet" \
              --image-id "$image" \
              --display-name vol-diagnostics-a1 \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 50 \
              --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBLIC_KEY\"}" \
              --wait-for-state RUNNING 2>&1)
            code=$?
            if [ $code -eq 0 ]; then
              echo "SUCCESS in $region"
              ip=$(echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data']['public-ip'])" 2>/dev/null || echo "unknown — check console")
              echo "launched=true" >> "$GITHUB_OUTPUT"
              echo "region=$region" >> "$GITHUB_OUTPUT"
              echo "ip=$ip" >> "$GITHUB_OUTPUT"
              launched="true"
              break
            elif echo "$out" | grep -qi "out of host capacity"; then
              echo "  no capacity in $region/$ad"
            else
              echo "  unexpected error in $region/$ad:"
              echo "$out" | tail -5
            fi
          done <<< "$TARGETS"
          if [ "$launched" = "false" ]; then
            echo "launched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue announcing the new instance
        if: steps.attempt.outputs.launched == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `A1.Flex instance launched in ${{ steps.attempt.outputs.region }}`,
              body: [
                `An Always-Free VM.Standard.A1.Flex (2 OCPU / 12 GB) instance was successfully`,
                `launched in **${{ steps.attempt.outputs.region }}**.`,
                ``,
                `**Public IP:** ${{ steps.attempt.outputs.ip }}`,
                ``,
                `Next steps — see .planning/notes/ORACLE-CLOUD-SETUP.md`,
                `("Migrating to a New Instance") for the full cutover checklist:`,
                `open firewall ports, deploy.sh, migrate-data.ps1, update ORACLE_HOST`,
                `secret, update CLAUDE.md deploy command, verify, then terminate the`,
                `old E2.1.Micro instance.`,
                ``,
                `This workflow (a1-flex-retry.yml) will keep running but will skip`,
                `future launch attempts since an instance named vol-diagnostics-a1`,
                `now exists — disable the schedule once migration is complete.`,
              ].join("\n"),
            });
