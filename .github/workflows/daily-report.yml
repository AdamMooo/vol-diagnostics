name: Daily Data Collection

# Runs the daily data collection pipeline on GitHub's runners.
# Email removed 2026-08-18 — focus is data collection reliability only.
#
# History (out/gex_snapshots.parquet, out/surface_history/, etc.) is NOT stored in
# git — it lives in Oracle Object Storage, which is the one source of truth. Each
# run restores it, appends today's data, and writes it straight back.
#
# The Oracle VM is deliberately NOT in this path (2026-08-20). It used to hold the
# only copy, bridged in and out by rsync over SSH, which made one 1-vCPU box a hard
# dependency of the whole pipeline — an unreachable host on 2026-08-17 took collection
# down with it. The VM now only displays the data and is disposable.

on:
  schedule:
    # Three firings, not one. GitHub drops scheduled triggers under load and never
    # retries them — that is why 2026-08-19 has no run at all and its option chain is
    # gone for good (Cboe serves only a current snapshot, so a gap cannot be
    # backfilled). run_daily derives the session from the NYSE calendar and no-ops
    # when the data is already there, so a later firing is a free catch-up and a
    # harmless skip when the first one worked.
    - cron: "35 20 * * 1-5"  # 20:35 UTC = 4:35pm ET, weekdays — primary
    - cron: "30 22 * * 1-5"  # 22:30 UTC = 6:30pm ET, same session — catch-up
    - cron: "30 0 * * 2-6"   # 00:30 UTC = 8:30pm ET previous day — last chance
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-run even if today's data was already collected"
        type: boolean
        default: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chromium (for kaleido PNG export)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore history from Object Storage
        env:
          OCI_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY_ID }}
          OCI_CUSTOMER_SECRET_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
        run: |
          python -m engine.restore_from_oci \
            --bucket vol-diagnostics-backup --region ca-toronto-1 --dest ./out --force
          # restore_from_oci exits 0 when the bucket is empty. Harmless while OCI was
          # only a backup, but it is the source of truth now: an empty restore would
          # rebuild history from nothing, and the backup step below would then
          # overwrite the good copy with it. Fail loudly instead.
          test -s out/gex_snapshots.parquet \
            || { echo "ERROR: restore produced no snapshot history"; exit 1; }

      - name: Collect daily data
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m engine.run_daily --force
          else
            python -m engine.run_daily
          fi

      - name: Backup out/ to Oracle Object Storage
        if: always()  # even if the email step failed, back up whatever snapshots did save
        env:
          OCI_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY_ID }}
          OCI_CUSTOMER_SECRET_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
        run: |
          python -m engine.backup_to_oci --bucket vol-diagnostics-backup --region ca-toronto-1 --source ./out

      - name: Health check
        run: python -m engine.health_check --strict

      # Failure-only. The daily report email was retired 2026-08-18 as noise; this is
      # the opposite — it fires only when something is actually broken. Email rather
      # than relying on the GitHub issue alone, because issues depend on notification
      # settings and every prior alert was swallowed before anyone saw it.
      - name: Email failure alert
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GEX_EMAIL_TO: ${{ secrets.GEX_EMAIL_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m engine.alert \
            --workflow "Daily Data Collection" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --detail "Data collection did not complete. A session&#39;s option chain cannot be backfilled once the day passes."
