name: Daily Vol Report

# Runs the daily data collection + email pipeline on GitHub's runners instead of
# the Oracle box — avoids the 1 vCPU/1GB Micro instance's headless-Chromium
# hangs during PNG export, since GH runners have far more RAM/CPU to spare.
#
# History (out/gex_snapshots.parquet, out/surface_history/, etc.) is NOT stored
# in git — it's rsynced down from the Oracle server before the run and back up
# after, so the Oracle server's disk stays the one source of truth the dashboard
# reads from. Git only ever holds code.

on:
  schedule:
    - cron: "35 20 * * 1-5"  # 20:35 UTC = 4:35pm ET, weekdays — matches the old crontab
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-run even if today's data was already collected"
        type: boolean
        default: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chromium (for kaleido PNG export) and rsync
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up SSH key for Oracle sync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          # StrictHostKeyChecking=no rather than a separate ssh-keyscan step: keyscan
          # is a network round-trip that can flake transiently, and a failed keyscan
          # here silently breaks host-key verification on every later step. This is a
          # single already-known server (not an arbitrary host), so skipping strict
          # checking is a reasonable trade for reliability.
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.ORACLE_HOST }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Pull current history down from Oracle
        run: |
          mkdir -p out
          # --rsync-path="sudo rsync": the parquet files are owned by root (written
          # by the dashboard container running as root against the bind-mounted
          # out/ dir) — the ubuntu user can't read them without elevating remotely.
          rsync -avz --rsync-path="sudo rsync" -e "ssh -i ~/.ssh/oracle.key" \
            "ubuntu@${{ secrets.ORACLE_HOST }}:~/vol-diagnostics/out/" ./out/

      - name: Run daily report
        env:
          GEX_EMAIL_TO: ${{ secrets.GEX_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m engine.run_daily --send --force
          else
            python -m engine.run_daily --send
          fi

      - name: Backup out/ to Oracle Object Storage
        if: always()  # even if the email step failed, back up whatever snapshots did save
        continue-on-error: true  # supplementary backup only — OCI_* secrets not configured yet; don't fail the job over it
        env:
          OCI_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY_ID }}
          OCI_CUSTOMER_SECRET_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
        run: |
          python -m engine.backup_to_oci --bucket vol-diagnostics-backup --region ca-toronto-1 --source ./out

      - name: Push updated history back up to Oracle
        if: always()  # even if the email step failed, push whatever snapshots did save
        run: |
          rsync -avz -e "ssh -i ~/.ssh/oracle.key" \
            ./out/ "ubuntu@${{ secrets.ORACLE_HOST }}:~/vol-diagnostics/out/"

      - name: Health check
        run: python -m engine.health_check --strict
