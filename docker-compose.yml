# Vol Diagnostics — Docker Compose
# Services: dashboard (Streamlit), caddy (HTTPS proxy)
#
# The daily data-collection/email job runs on GitHub Actions instead of a
# container here (.github/workflows/daily-report.yml) — this box's 1 vCPU/1GB
# couldn't reliably run headless Chromium for PNG export (hung mid-render on
# 2026-07-14's first live run). GitHub's runners have far more RAM/CPU to spare.
# History still lives on this server's disk (out/) as the one source of truth;
# the workflow rsyncs it down before each run and back up after.

services:
  dashboard:
    build:
      context: .
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
    container_name: vol-diagnostics-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./out:/app/out
      - ./.env:/app/.env:ro
    # The .env mount above is a file, not environment: without env_file the OCI
    # keys are invisible to `docker compose exec ... python -m engine.restore_from_oci`,
    # which is how this box now pulls fresh data (2026-08-20).
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: vol-diagnostics-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
