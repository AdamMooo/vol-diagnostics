# Gamma OMM — Docker Compose
# Services: dashboard (Streamlit), scheduler (daily data collection), caddy (HTTPS proxy)

services:
  dashboard:
    build: .
    container_name: gamma-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - parquet-data:/app/out
      - ./.env:/app/.env:ro
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    container_name: gamma-scheduler
    restart: unless-stopped
    volumes:
      - parquet-data:/app/out
      - ./.env:/app/.env:ro
    environment:
      - GEX_SEND=1
    entrypoint: ["supercronic", "/app/crontab"]
    healthcheck:
      test: ["CMD", "python", "-m", "engine.health_check", "--strict"]
      interval: 60m
      timeout: 30s
      retries: 1
      start_period: 6h

  caddy:
    image: caddy:2-alpine
    container_name: gamma-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard

volumes:
  parquet-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
