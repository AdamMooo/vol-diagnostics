# Desk-terminal theme — vol diagnostics dashboard.
#
# Design intent: this reads as a professional risk tool, not a consumer app.
# Sharp corners, thin rules, tabular monospace numerals, exactly one accent
# colour. Red and green are reserved for P&L-adjacent semantics (premium
# rich/cheap) and are never used for chrome — the default Streamlit
# primaryColor (#FF4B4B) was alarm-red on ticker chips, which reads as "loss"
# on a finance surface.
#
# DARK-ONLY ON PURPOSE (2026-08-06). Streamlit shows the light/dark toggle only
# when BOTH [theme.light] and [theme.dark] exist; defining just one locks the app
# to a single mode. Light is deliberately omitted because the app is not yet
# theme-aware and light mode renders broken:
#   - engine/gex/analytics.py hardcodes template="plotly_dark" in 5 places (and
#     "plotly_white" in one — a pre-existing inconsistency), so charts would be
#     black boxes on a white page;
#   - app.py's _CSS and inline HTML carry ~11 hardcoded dark-mode hex/rgba values
#     (#64748b, #8b949e, #334155, …) that go illegible on light.
# To re-enable light: drive the Plotly template from st.context.theme.type, move
# those hex values onto theme variables, THEN restore a [theme.light] block (the
# full light palette is recoverable from this file's git history).

[theme]
base = "dark"

font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

baseFontSize = 14
baseFontWeight = 400
codeFontSize = "0.8125rem"
headingFontSizes = ["26px", "19px", "15px", "13px", "12px", "11px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false

baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
showSidebarBorder = true

[theme.dark]
primaryColor = "#1F6FEB"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#141A22"
textColor = "#D5DCE5"
linkColor = "#58A6FF"
borderColor = "#232B36"
codeBackgroundColor = "#0E141B"
codeTextColor = "#B7C2CF"

redColor = "#F0616D"
greenColor = "#3FB950"
orangeColor = "#D29922"
yellowColor = "#D9B44A"
blueColor = "#58A6FF"
violetColor = "#A371F7"
grayColor = "#7D8894"

dataframeBorderColor = "#232B36"
dataframeHeaderBackgroundColor = "#141A22"

# Sequential ramp for surface/heat visuals — perceptually ordered, dark-safe.
chartCategoricalColors = ["#58A6FF", "#3FB950", "#D29922", "#A371F7", "#F0616D", "#39C5CF", "#7D8894"]
chartSequentialColors = ["#0B0F14", "#10202F", "#13324A", "#154566", "#155A83", "#1170A1", "#1E87BF", "#3E9EDA", "#6DB6E8", "#A3CFF2"]

[theme.dark.sidebar]
backgroundColor = "#080B0F"
secondaryBackgroundColor = "#141A22"
codeBackgroundColor = "#0E141B"
textColor = "#C3CCD7"
borderColor = "#1E252F"
primaryColor = "#1F6FEB"

